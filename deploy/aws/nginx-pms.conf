# nginx del PMS: la página (React compilado) y la API en el mismo puerto 80.
#   /api/...  → Node.js en 127.0.0.1:3000
#   todo lo demás → /var/www/hotel-pms (si la ruta no existe, index.html: React Router la resuelve)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/hotel-pms;
    index index.html;

    # No decir la versión de nginx
    server_tokens off;
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Archivos con huella en el nombre (Vite): se pueden guardar en caché mucho tiempo
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
